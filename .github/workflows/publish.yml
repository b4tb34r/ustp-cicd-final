name: Publish to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      run_branch:
        description: 'Branch des letzten erfolgreichen Builds (standard: main)'
        required: false
        default: 'main'
      artifact_name:
        description: 'Zu verwendendes Build-Artefakt (standard: webapp-build-ubuntu-latest)'
        required: false
        default: 'webapp-build-ubuntu-latest'        
      coverage_artifact_name:
        description: 'Coverage-Artefaktname (standard: coverage-report-ubuntu-latest)'
        required: false
        default: 'coverage-report-ubuntu-latest'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    name: Download build artifact & deploy to Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      # Lädt das Artefakt aus dem letzten erfolgreichen Run der build.yml auf dem gewünschten Branch.
      - name: Download build artifact from latest successful build run
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: ${{ inputs.run_branch }}
          workflow_conclusion: success
          name: ${{ inputs.artifact_name }}
          path: ./site
          # Extrahieren aktivieren: Dateien stehen direkt im Zielpfad
          # (da im Build 'dist/**' hochgeladen wird, enthält das Artefakt die Inhalte von dist/)
          if_no_artifact_found: fail
          check_artifacts: true
          skip_unpack: false

      # ⬇️ Coverage-Report (Ubuntu) laden
      - name: Download coverage artifact (ubuntu)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: ${{ inputs.run_branch }}
          workflow_conclusion: success
          name: ${{ inputs.coverage_artifact_name }}   # default: coverage-report-ubuntu-latest
          path: ./_cov/ubuntu
          if_no_artifact_found: warn
          check_artifacts: true
          skip_unpack: false

      # (Optional) Windows-Coverage als Fallback laden
      - name: Download coverage artifact (windows) [optional]
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          branch: ${{ inputs.run_branch }}
          workflow_conclusion: success
          name: coverage-report-windows-latest
          path: ./_cov/windows
          if_no_artifact_found: warn
          check_artifacts: true
          skip_unpack: false

      # Coverage-Summary an Pages-Pfad kopieren (Ubuntu bevorzugt, sonst Windows)
      - name: Prepare public coverage JSON
        run: |
          mkdir -p site/coverage
          if [ -f "_cov/ubuntu/coverage-summary.json" ]; then
            cp _cov/ubuntu/coverage-summary.json site/coverage/coverage-summary.json
            echo "Using Ubuntu coverage-summary.json"
          elif [ -f "_cov/windows/coverage-summary.json" ]; then
            cp _cov/windows/coverage-summary.json site/coverage/coverage-summary.json
            echo "Using Windows coverage-summary.json"
          else
            echo "No coverage-summary.json found; skipping public coverage export."
          fi


      # Optional: Verifiziere, dass Inhalte da sind
      - name: List downloaded files (debug)
        run: |
          echo "Listing ./site:"
          ls -la ./site
          echo "Try to detect an index.html (typisch für SPA/Static Site):"
          find ./site -maxdepth 2 -name "index.html" -print || true
          echo "Listing ./site/coverage (coverage JSON expected):"
          ls -la ./site/coverage || true
          test -f ./site/coverage/coverage-summary.json && cat ./site/coverage/coverage-summary.json || true


      # Packe die Seiten-Inhalte als Pages-Artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Deploye das Pages-Artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
